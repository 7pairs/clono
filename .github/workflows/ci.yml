name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
          - os: windows-2025
            architecture: x64
          - os: ubuntu-24.04
            architecture: x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.architecture }}
          check-latest: true
          cache-jdk: false

      - name: Set up npm
        run: npm install --global npm@11.19.1

      - name: Log environment
        run: |
          node -p "'Node.js ' + process.version + ' (' + process.platform + '/' + process.arch + ')'"
          npm --version
          java --version

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run verify
