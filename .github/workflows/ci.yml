name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22"
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and pack
        run: |
          mkdir -p target/package
          npm pack --pack-destination target/package

      - name: Verify package
        run: |
          tarball="$(find target/package -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"

          npm install \
            --prefix target/consumer \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "$tarball"

          command_path="target/consumer/node_modules/.bin/clono"
          "$command_path" --help
          "$command_path" --version

          set +e
          "$command_path" --unknown
          exit_code=$?
          set -e

          test "$exit_code" -eq 1
