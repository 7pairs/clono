<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Page layout</title>
  <desc id="desc">A page containing a main content area and a smaller note area</desc>
  <rect width="640" height="240" rx="24" fill="#f8fafc"/>
  <rect x="150" y="25" width="340" height="190" rx="8" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <rect x="180" y="50" width="280" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <rect x="180" y="160" width="280" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <g font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="320" y="103" fill="#1e3a8a">Main content</text>
    <text x="320" y="183" fill="#78350f">Note</text>
  </g>
</svg>
